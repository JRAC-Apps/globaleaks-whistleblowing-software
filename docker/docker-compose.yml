services:
  globaleaks:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      # HTTP -> HTTPS redirect
      - "traefik.http.routers.audit-globaleaks-zejcly-5-web.rule=Host(`speakup.jrac.com.sa`)"
      - "traefik.http.routers.audit-globaleaks-zejcly-5-web.entrypoints=web"
      - "traefik.http.routers.audit-globaleaks-zejcly-5-web.middlewares=redirect-to-https@file"
      - "traefik.http.routers.audit-globaleaks-zejcly-5-web.service=globaleaks"
      # HTTPS via Let's Encrypt -> globaleaks backend (TLS, self-signed) on 8443
      - "traefik.http.routers.audit-globaleaks-zejcly-5-websecure.rule=Host(`speakup.jrac.com.sa`)"
      - "traefik.http.routers.audit-globaleaks-zejcly-5-websecure.entrypoints=websecure"
      - "traefik.http.routers.audit-globaleaks-zejcly-5-websecure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.audit-globaleaks-zejcly-5-websecure.service=globaleaks"
      - "traefik.http.services.globaleaks.loadbalancer.server.port=8443"
      - "traefik.http.services.globaleaks.loadbalancer.server.scheme=https"
      - "traefik.http.services.globaleaks.loadbalancer.serverstransport=insecure@file"
    environment:
      DISTRIBUTION: trixie
    build: .
    restart: unless-stopped
    container_name: globaleaks
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run/globaleaks:mode=1777
      - /tmp:mode=1777
    volumes:
      - globaleaks:/var/globaleaks:rw
    expose:
      - "8443"
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8443/api/health"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - dokploy-network
      - default
volumes:
  globaleaks: {}
networks:
  dokploy-network:
    external: true
